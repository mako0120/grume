style:
  default_area: 大阪
  max_caption_chars: 90
  avoid_fabrication: true
  require_photo_first: true
  short_sentences: true
  emoji: true
  avoid_duplicate_strong_expressions: true

strong_expressions:
  - 優勝すぎる
  - ビジュやばすぎる
  - 反則級
  - 主役級
  - 止まらん
  - たまらん
  - えぐい
  - 最高すぎる
  - 沼る
  - 香ばしさ、罪すぎる

cover:
  store_name: true
  hook: true
  nearest_station: true
  area: true
